<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watch a Living Window</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      .snaps { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: .75rem; }
      .snap { position: relative; border-radius: 12px; overflow: hidden; background: #0e1320; border: 1px solid #2a3350; aspect-ratio: 16 / 9; }
      .snap.focus { border-color: #ffd08a; box-shadow: 0 0 24px #ffb36b55; }
      .snap img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .snap span { position: absolute; left: .5rem; bottom: .4rem; font-size: .78rem; background: #0b0e16cc; padding: .1rem .5rem; border-radius: 999px; }
      .hold { user-select: none; -webkit-user-select: none; touch-action: none; }
      .hold.on { background: #ff8a7a; }
    </style>
  </head>
  <body>
    <header class="top">
      <div><h1 id="title">Living Window</h1><p class="tagline">A campfire story you can step into.</p></div>
      <nav>
        <span class="pill" id="live">offline</span>
        <span class="pill" id="roomPill"></span>
  <span class="pill" id="people" hidden></span>
        <a class="pill" href="/community.html">Community</a>
        <a class="pill" href="/">Start your own</a>
      </nav>
    </header>
    <div class="wrap grid2">
      <div>
        <section>
          <h2>The windows</h2>
          <div class="liveview" id="liveBox" hidden>
            <video id="liveVideo" playsinline autoplay muted></video>
            <div class="liveBar"><span class="liveTag">● LIVE</span><span id="liveWhich"></span><button type="button" class="ghost" id="liveSound">🔊 Tap for sound</button></div>
          </div>
          <p class="muted liveNote" id="liveNote" hidden></p>
          <div class="snaps" id="snaps"><div class="empty">Waiting for the storyteller to open a window…</div></div>
          <div class="narration" id="narration"></div>
          <div id="nextBox" hidden style="margin-top:.8rem">
            <div class="muted" id="nextLabel" style="font-size:.85rem;margin-bottom:.4rem">What could happen next</div>
            <div class="chips" id="choices"></div>
          </div>
        </section>
        <section id="coPanel" hidden>
          <h2 id="coTitle">You're a co-narrator</h2>
          <form class="row" id="coForm">
            <input id="coLine" placeholder="Say what happens next…" autocomplete="off" maxlength="300" />
            <button>Send</button>
            <button type="button" class="ghost hold" id="mic">Hold to talk</button>
          </form>
          <div class="err" id="coErr"></div>
        </section>
        <section class="chat storyFeed">
          <div class="chatHead"><h2>The story so far</h2></div>
          <div class="chatScroll">
            <div id="feed" class="chatLog" role="log" aria-live="polite" aria-label="The story so far"></div>
            <button type="button" class="jump" id="feedJump" hidden>↑ New story above</button>
          </div>
        </section>
      </div>
      <div>
        <section class="chat" id="ideasChat">
          <div class="chatHead"><h2>Stream chat <span class="count" id="suggCount"></span></h2></div>
          <div class="pinned" id="pinned" hidden></div>
          <div class="chatScroll">
            <div id="suggs" class="chatLog" role="log" aria-live="polite" aria-label="Ideas from the audience"></div>
            <button type="button" class="jump" id="jump" hidden>↑ New ideas above</button>
          </div>
          <form id="suggest" class="chatForm">
            <textarea id="idea" rows="1" maxlength="140" placeholder="Send an idea: what happens next?" aria-label="Your idea"></textarea>
            <div class="chatFoot">
              <input id="who" placeholder="Your name" maxlength="20" autocomplete="nickname" aria-label="Your name, shown with your idea" />
              <span class="muted" id="ideaCount" hidden>0 / 140</span>
              <button id="postIdea" disabled>Chat</button>
            </div>
          </form>
          <p class="chatNote" id="crowdNote"></p>
        </section>
      </div>
    </div>
    <script type="module" src="/src/watch.js"></script>
  </body>
</html>
