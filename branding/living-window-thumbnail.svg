<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="70%">
      <stop offset="0" stop-color="#1a1426"/>
      <stop offset="0.55" stop-color="#0f111c"/>
      <stop offset="1" stop-color="#07090f"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d4a"/>
      <stop offset="0.38" stop-color="#7a3f6a"/>
      <stop offset="0.62" stop-color="#ff9a5a"/>
      <stop offset="0.74" stop-color="#ffd08a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a52"/>
      <stop offset="1" stop-color="#140f24"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3e0" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffd08a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9a5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.62" stop-color="#ff9a5a" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#ffb36b" stop-opacity="0.45"/>
      <stop offset="0.82" stop-color="#ff9a5a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff9a5a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="win"><circle cx="512" cy="500" r="300"/></clipPath>
  </defs>
<defs><radialGradient id="bgw" cx="30%" cy="50%" r="80%"><stop offset="0" stop-color="#1a1426"/><stop offset="0.55" stop-color="#0f111c"/><stop offset="1" stop-color="#07090f"/></radialGradient></defs>
<rect width="1920" height="1080" fill="url(#bgw)"/>
<g transform="translate(80,40)">

  
  <!-- distant stars in the real room -->
  <g fill="#f3ead8" opacity="0.55">
    <circle cx="140" cy="160" r="2"/><circle cx="880" cy="130" r="2.4"/><circle cx="210" cy="860" r="1.8"/>
    <circle cx="860" cy="880" r="2"/><circle cx="90" cy="520" r="1.6"/><circle cx="950" cy="470" r="1.6"/>
    <circle cx="300" cy="90" r="1.4"/><circle cx="760" cy="950" r="1.4"/>
  </g>

  <!-- warm halo behind the portal -->
  <circle cx="512" cy="500" r="470" fill="url(#halo)"/>

  <!-- the living world inside the window -->
  <g clip-path="url(#win)">
    <rect x="200" y="190" width="630" height="630" fill="url(#sky)"/>
    <!-- a few early stars in the story sky -->
    <g fill="#fff3e0" opacity="0.8">
      <circle cx="420" cy="270" r="2.2"/><circle cx="600" cy="245" r="1.8"/><circle cx="680" cy="320" r="1.6"/><circle cx="350" cy="340" r="1.4"/>
    </g>
    <circle cx="512" cy="590" r="210" fill="url(#sunGlow)"/>
    <circle cx="512" cy="598" r="66" fill="#fff3e0"/>
    <!-- far hills -->
    <path d="M200 560 C 270 520, 330 515, 390 540 C 420 552, 440 570, 462 600 L200 600 Z" fill="#5c3159"/>
    <path d="M566 600 C 600 560, 670 505, 760 530 C 800 543, 820 545, 830 548 L830 600 Z" fill="#5c3159"/>
    <!-- near headlands -->
    <path d="M200 590 C 250 560, 300 572, 350 590 L 360 600 L200 600 Z" fill="#2f1b3e"/>
    <path d="M640 600 C 700 566, 770 560, 830 575 L830 600 Z" fill="#2f1b3e"/>
    <!-- bay -->
    <rect x="200" y="598" width="630" height="230" fill="url(#water)"/>
    <!-- sun path on the water -->
    <g fill="#ffd08a">
      <rect x="470" y="612" width="84" height="5" rx="2.5" opacity="0.9"/>
      <rect x="482" y="632" width="60" height="4" rx="2" opacity="0.75"/>
      <rect x="456" y="652" width="70" height="4" rx="2" opacity="0.55"/>
      <rect x="532" y="660" width="34" height="3" rx="1.5" opacity="0.5"/>
      <rect x="490" y="680" width="44" height="3" rx="1.5" opacity="0.4"/>
      <rect x="470" y="704" width="30" height="3" rx="1.5" opacity="0.3"/>
      <rect x="528" y="716" width="22" height="3" rx="1.5" opacity="0.25"/>
    </g>
    <!-- small boat -->
    <g fill="#140f24">
      <path d="M360 676 L412 676 L404 686 L368 686 Z"/>
      <path d="M386 676 L386 640 L406 674 Z"/>
    </g>
  </g>

  <!-- the ring, traced in the air -->
  <circle cx="512" cy="500" r="302" fill="none" stroke="#ff9a5a" stroke-width="26" opacity="0.55" filter="url(#blur8)"/>
  <circle cx="512" cy="500" r="302" fill="none" stroke="#ffd08a" stroke-width="10"/>
  <circle cx="512" cy="500" r="302" fill="none" stroke="#fff3e0" stroke-width="3" opacity="0.9"/>
  <!-- second, looser pass of the circle being drawn -->
  <path d="M 512 168 A 332 332 0 1 1 210 360" fill="none" stroke="#ffb36b" stroke-width="4" stroke-linecap="round" opacity="0.55" stroke-dasharray="2 14"/>
  <path d="M 512 180 A 320 320 0 0 1 820 420" fill="none" stroke="#ffd08a" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- sparks thrown off the ring -->
  <g filter="url(#blur3)" fill="#ffb36b" opacity="0.9">
    <circle cx="790" cy="300" r="7"/><circle cx="236" cy="660" r="6"/><circle cx="700" cy="790" r="5"/>
  </g>
  <g fill="#fff3e0">
    <circle cx="790" cy="300" r="3.5"/><circle cx="828" cy="262" r="2.4"/><circle cx="852" cy="236" r="1.6"/>
    <circle cx="236" cy="660" r="3"/><circle cx="198" cy="690" r="2"/><circle cx="176" cy="716" r="1.4"/>
    <circle cx="700" cy="790" r="2.6"/><circle cx="730" cy="826" r="1.8"/>
    <circle cx="300" cy="250" r="2.2"/><circle cx="270" cy="222" r="1.4"/>
  </g>
</g>
<g font-family="'Iowan Old Style','Palatino','Georgia',serif">
  <text x="1130" y="470" font-size="132" fill="#ffe9c7" font-weight="600" letter-spacing="1">Living</text>
  <text x="1130" y="610" font-size="132" fill="#ffd08a" font-weight="600" letter-spacing="1">Window</text>
  <text x="1134" y="700" font-size="44" fill="#f3ead8" opacity="0.8" font-style="italic">A campfire story you can step into.</text>
</g>
<rect x="1134" y="750" width="120" height="4" rx="2" fill="#ff9a5a" opacity="0.8"/>
</svg>